name: Source checks
on:
  push:
    branches: [main, launch/free-pilot]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax and server tests
        working-directory: app
        run: |
          node --check app.js
          node --check intelligence.js
          node --check server.cjs
          node --test test-server.cjs
          node --test test-validation.cjs
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm audit --audit-level=high
      - name: Browser acceptance and automated accessibility
        run: |
          node app/server.cjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then break; fi
            sleep 1
          done
          npm run test:browser
